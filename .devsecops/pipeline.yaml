capabilities:
  secret_detection: true
  static_analysis: true
  dependency_analysis: true
  infrastructure_analysis: false
  build: true
  unit_testing: true
  integration_testing: false
  policy_enforcement: false
  gitops_update: true
  image_signing: true
  admission_control: true
  cluster_validation: true

build:
  working_directory: .
  runtime:
    language: node
    version: "22"
    package_manager: null
  command: null

testing:
  working_directory: .
  unit:
    enabled: true
    command: null
  integration:
    enabled: false
    command: null

container:
  dockerfile: ./Dockerfile
  context: .
  image:
    name: application
    tag: null
  registry:
    type: dockerhub
    repository: null

policy:
  paths:
    - deploy/
  policy_paths:
    - .devsecops/policies/